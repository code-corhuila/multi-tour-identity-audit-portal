# The identity-audit portal as its own container (Annex H): a static server behind the gateway, no published
# port. The root composition of multi-tour-infra-postgres includes this file; the network `platform` is
# created by its scripts/up.sh. Stopping this service only takes its area down (the gateway answers 503).
services:
  multi-tour-identity-audit-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
