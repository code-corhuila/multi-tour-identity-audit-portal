# Static server of the portal module. The gateway maps /portals/identity-audit-portal.{js,css} to /portal.{js,css}
# here. The entry is never cached, so a new build reaches the browser without a stale module.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
